<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Links</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: radial-gradient(circle at top, #1a1a2e 0%, #0f0f1f 100%);
        }
        /* Estilo unificado para botões – mais sóbrio e profissional */
        .btn-link {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            color: #f0f0ff;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }
        .btn-link:hover {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(138, 92, 246, 0.5);
            box-shadow: 0 8px 28px rgba(138, 92, 246, 0.15);
            transform: translateY(-2px);
        }
        .btn-link .icon-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(138, 92, 246, 0.2);
            color: #a78bfa;
            transition: all 0.3s;
        }
        .btn-link:hover .icon-wrapper {
            background: rgba(138, 92, 246, 0.35);
            color: #c4b5fd;
        }
        .btn-link .btn-text {
            flex: 1;
            text-align: left;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .btn-link .fa-chevron-right {
            opacity: 0.5;
            transition: all 0.3s;
        }
        .btn-link:hover .fa-chevron-right {
            opacity: 1;
            transform: translateX(4px);
        }
        /* Ajuste para o container do logotipo */
        .glow-ring {
            background: radial-gradient(circle at center, rgba(138, 92, 246, 0.3) 0%, transparent 70%);
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col items-center justify-between p-6">

    <!-- Container Principal -->
    <main class="w-full max-w-[440px] flex flex-col items-center text-center mt-10">
        
        <!-- Logotipo com efeito de brilho suave -->
        <div class="relative mb-6 inline-block">
            <div class="absolute -inset-1 bg-gradient-to-r from-violet-600 to-indigo-600 rounded-2xl blur-xl opacity-40"></div>
            <img 
                src="https://i.ibb.co/gMgC66Dt/file-0000000091f8720e8df7d68f17fc4a32-2.jpg" 
                alt="Logotipo" 
                class="relative max-w-[200px] w-auto h-auto rounded-2xl shadow-2xl border border-slate-700/60"
            >
        </div>

        <h1 class="text-2xl font-bold tracking-wide mb-1 text-white/90">Nossa Marca</h1>
        <p class="text-sm text-slate-400 mb-8">Escolha uma opção para acessar nossos serviços.</p>

        <!-- Botões de Links -->
        <div class="w-full space-y-3">
            
            <!-- Botão WhatsApp -->
            <a 
                id="btn-whatsapp"
                href="#"
                target="_blank" 
                rel="noopener noreferrer"
                class="btn-link flex items-center w-full px-5 py-3.5 rounded-xl"
            >
                <div class="icon-wrapper">
                    <i class="fab fa-whatsapp text-lg"></i>
                </div>
                <span class="btn-text ml-3">Falar no WhatsApp</span>
                <i class="fas fa-chevron-right text-sm"></i>
            </a>

            <!-- Botão Cardápio Espetaria -->
            <a 
                id="btn-menu"
                href="#"
                target="_blank" 
                rel="noopener noreferrer"
                class="btn-link flex items-center w-full px-5 py-3.5 rounded-xl"
            >
                <div class="icon-wrapper">
                    <i class="fas fa-utensils text-lg"></i>
                </div>
                <span class="btn-text ml-3">Cardápio Espetaria</span>
                <i class="fas fa-chevron-right text-sm"></i>
            </a>

            <!-- Botão Página de Vendas -->
            <a 
                id="btn-sales"
                href="#"
                target="_blank" 
                rel="noopener noreferrer"
                class="btn-link flex items-center w-full px-5 py-3.5 rounded-xl"
            >
                <div class="icon-wrapper">
                    <i class="fas fa-shopping-bag text-lg"></i>
                </div>
                <span class="btn-text ml-3">Página de Vendas Demonstrativo</span>
                <i class="fas fa-chevron-right text-sm"></i>
            </a>

            <!-- Botão Cardápio Pastelaria -->
            <a 
                id="btn-pastelaria"
                href="#"
                target="_blank" 
                rel="noopener noreferrer"
                class="btn-link flex items-center w-full px-5 py-3.5 rounded-xl"
            >
                <div class="icon-wrapper">
                    <i class="fas fa-pizza-slice text-lg"></i>
                </div>
                <span class="btn-text ml-3">Cardápio Pastelaria</span>
                <i class="fas fa-chevron-right text-sm"></i>
            </a>

            <!-- Botão Cardápio Açougue (NOVO) -->
            <a 
                id="btn-acougue"
                href="#"
                target="_blank" 
                rel="noopener noreferrer"
                class="btn-link flex items-center w-full px-5 py-3.5 rounded-xl"
            >
                <div class="icon-wrapper">
                    <i class="fas fa-drumstick-bite text-lg"></i>
                </div>
                <span class="btn-text ml-3">Cardápio Açougue</span>
                <i class="fas fa-chevron-right text-sm"></i>
            </a>

        </div>

    </main>

    <!-- Rodapé -->
    <footer class="w-full text-center mt-12 py-4 border-t border-slate-800/40">
        <p class="text-xs text-slate-500">
            &copy; 2026 - Todos os direitos reservados.
        </p>
    </footer>

    <!-- ============================================================ -->
    <!-- SCRIPT DE INJEÇÃO DINÂMICA DOS LINKS (ofuscados em Base64)     -->
    <!-- ============================================================ -->
    <script>
        (function() {
            // URLs codificados em Base64 – NENHUM link real aparece no HTML
            const encodedUrls = {
                whatsapp: 'aHR0cHM6Ly93YS5tZS81NTM0OTkxMDU4OTk0',
                menu: 'aHR0cHM6Ly9sdWNpYW5vMDUwNDE5ODMtY2xvdWQuZ2l0aHViLmlvL2NhcmRhcGlvLWRlbW9uc3RyYWNhby8=',
                sales: 'aHR0cHM6Ly9sdWNpYW5vMDUwNDE5ODMtY2xvdWQuZ2l0aHViLmlvL01pbmktUHJvamV0b3ItUG9ydGF0aWwv',
                pastelaria: 'aHR0cHM6Ly9sdWNpYW5vMDUwNDE5ODMtY2xvdWQuZ2l0aHViLmlvL2NhcmRhcGlvLXBhc3RlbGFyaWEtZGVtb25zdHJhY2FvLw==',
                acougue: 'aHR0cHM6Ly9sdWNpYW5vMDUwNDE5ODMtY2xvdWQuZ2l0aHViLmlvL2Fjb3VndWUtY2FyZGFwaW8tZGVtb25zdHJhY2FvLw=='
            };

            // Decodifica Base64 (suporta textos com caracteres especiais)
            function decodeBase64(str) {
                try {
                    return atob(str);
                } catch (e) {
                    console.error('Erro ao decodificar Base64:', e);
                    return '#';
                }
            }

            // Obtém cada botão pelo ID e injeta o link real
            const btnWhatsapp = document.getElementById('btn-whatsapp');
            const btnMenu = document.getElementById('btn-menu');
            const btnSales = document.getElementById('btn-sales');
            const btnPastelaria = document.getElementById('btn-pastelaria');
            const btnAcougue = document.getElementById('btn-acougue');

            if (btnWhatsapp) btnWhatsapp.href = decodeBase64(encodedUrls.whatsapp);
            if (btnMenu) btnMenu.href = decodeBase64(encodedUrls.menu);
            if (btnSales) btnSales.href = decodeBase64(encodedUrls.sales);
            if (btnPastelaria) btnPastelaria.href = decodeBase64(encodedUrls.pastelaria);
            if (btnAcougue) btnAcougue.href = decodeBase64(encodedUrls.acougue);
        })();
    </script>
</body>
</html>
